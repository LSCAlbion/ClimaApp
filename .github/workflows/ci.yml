name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-ci:
    name: Backend (Test & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./weather-backend

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './weather-backend/package-lock.json'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Testes Unitários e de Integração (Vitest)
        run: npm test

      - name: Validar Build TypeScript
        run: npm run build

  frontend-ci:
    name: Frontend (Build Check)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./weather-frontend

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './weather-frontend/package-lock.json'

      - name: Instalar Dependências
        run: npm ci

      - name: Validar Build de Produção (Vite)
        run: npm run build